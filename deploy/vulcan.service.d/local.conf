# Machine-local overrides for the vulcan unit — installed as a systemd
# drop-in, NEVER by editing the installed unit file:
#
#   sudo mkdir -p /etc/systemd/system/vulcan.service.d
#   sudo cp deploy/vulcan.service.d/local.conf /etc/systemd/system/vulcan.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart vulcan
#
# Why a drop-in: the installed unit file is REPLACED wholesale on every unit
# update (sudo cp deploy/vulcan.service ...), so an edit made to it — like
# uncommenting an EnvironmentFile line — silently reverts on the next update.
# That exact regression happened on 2026-08-23: the Type=notify unit flip
# reverted the hosted-keys EnvironmentFile and broke every BYOK alias with
# missing_credential until this drop-in restored it. Drop-ins survive unit
# replacement; machine-local state belongs here.

[Service]
# Hosted BYOK keys (mode 600, untracked). The `-` prefix keeps local-only
# deployments valid: absent file, no hosted keys, hosted aliases refuse.
EnvironmentFile=-/home/kevin-lee/deploy/vulcan-data/.env
