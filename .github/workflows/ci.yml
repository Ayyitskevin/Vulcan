name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: quality (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report every interpreter: a failure on one version must not cancel the
      # others, or a version-specific break looks like a total break.
      fail-fast: false
      matrix:
        # 3.12 is the floor declared by requires-python; 3.13 is the newest
        # version the gate is known to pass on.
        python-version: ["3.12", "3.13"]
    env:
      # Every uv command in this job resolves to the matrix interpreter rather
      # than whatever discovery happens to find first.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
      - run: uv sync --all-groups --locked
      # Makes the log say which interpreter actually ran the gate below.
      - run: uv run python -VV
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest
      # Gate command 4 of 4 (docs/ROADMAP.md §1): real-process smoke on an
      # ephemeral loopback port; stdlib + `ss` only, both on ubuntu-latest.
      - run: uv run python scripts/smoke.py

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      # Full history: a leaked credential in an old commit is still a leaked
      # credential once the repo is public.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pinned action release. The repo-root .gitleaks.toml (auto-detected by
      # the gitleaks CLI) extends the built-in defaults and allowlists exactly
      # the two test-sentinel values; anything else credential-shaped fails CI.
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          # Required by the action for PR scans (breaking change, v2.3+).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin the CLI to the version the .gitleaks.toml allowlist was
          # verified against locally; the action's default lags behind.
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_SUMMARY: "true"
